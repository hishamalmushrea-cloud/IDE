name: Cloud APK

# Builds an installable APK completely in the cloud (GitHub Actions runners) and publishes it
# as a downloadable release asset. No local machine resources are used.
#
# - On success: the APK is attached to the `apk-latest` prerelease, so it can be downloaded
#   directly from the repository's Releases page.
# - On failure: a report containing all compiler errors is posted as a comment on the pull
#   request which triggered the build (if any), and the full Gradle log is uploaded as an
#   artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: cloud-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  BUILD_LOG: ${{ github.workspace }}/cloud-apk-build.log

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK"
          CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMDLINE" ]; then
            echo "cmdline-tools not found, downloading..."
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-12209519_latest.zip"
            rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
            mkdir -p /tmp/cmdline-tools "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$CMDLINE" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$CMDLINE" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "--- local.properties ---"
          cat local.properties

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :core:app:assembleDebug --continue --stacktrace 2>&1 | tee "$BUILD_LOG"

      - name: Collect APK
        id: collect
        if: success()
        run: |
          set -euo pipefail
          mkdir -p cloud-apk
          find core/app/build/outputs/apk -type f -name "*.apk" -exec cp {} cloud-apk/ \;
          ls -la cloud-apk/
          APK=$(find cloud-apk -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK was produced by the build." >&2
            exit 1
          fi
          SHA="$(git rev-parse --short HEAD)"
          META=$(find core/app/build/outputs/apk -name "output-metadata.json" | head -n 1)
          VERSION_NAME=""
          VERSION_CODE=""
          if [ -n "$META" ]; then
            VERSION_NAME=$(grep -o '"versionName": *"[^"]*"' "$META" | head -n 1 | cut -d'"' -f4)
            VERSION_CODE=$(grep -o '"versionCode": *[0-9]*' "$META" | head -n 1 | grep -o '[0-9]*')
          fi
          NAME="aide-next-${VERSION_NAME:-0.0.0}-${SHA}-debug.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          cp "$APK" "cloud-apk/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=cloud-apk/$NAME" >> "$GITHUB_OUTPUT"
          echo "### ✅ APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "cloud-apk/$NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          du -h "cloud-apk/$NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**App version:** \`${VERSION_NAME:-unknown}\` (code ${VERSION_CODE:-unknown})" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="apk-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AIDE Next - Latest APK (cloud build)" \
              --notes "AIDE Next - automatically built APK. This moving tag always points to the most recent successful cloud build." \
              --prerelease
          fi
          gh release upload "$TAG" "${{ steps.collect.outputs.apk_path }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # stable download name which always points to the newest successful build
          cp "${{ steps.collect.outputs.apk_path }}" "cloud-apk/aide-next-latest-debug.apk"
          gh release upload "$TAG" "cloud-apk/aide-next-latest-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK uploaded to https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "Stable link: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/aide-next-latest-debug.apk"
          {
            echo "AIDE Next ${{ steps.collect.outputs.version_name }} (code ${{ steps.collect.outputs.version_code }})"
            echo ""
            echo "Built from commit \`$(git rev-parse --short HEAD)\` on branch \`${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}\`."
            echo ""
            echo "This moving tag always points to the most recent successful cloud build."
            echo ""
            echo "| file | description |"
            echo "| --- | --- |"
            echo "| \`aide-next-latest-debug.apk\` | newest build, permanent link |"
            echo "| \`${{ steps.collect.outputs.apk_name }}\` | this build |"
            echo ""
            echo "Based on the open source AndroidIDE project (GPL-3.0)."
          } > cloud-apk-release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file cloud-apk-release-notes.md || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aidenext-debug-apk
          path: cloud-apk/*.apk
          if-no-files-found: error

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOG="${BUILD_LOG}"
          {
            echo "### ❌ Cloud APK build failed"
            echo ""
            echo "**Branch:** \`${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}\`  |  **Commit:** \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "#### Compiler errors"
            echo '```'
            grep -E "^e: |^error:|error: |FAILURE: |Execution failed for task|^> Task .* FAILED" "$LOG" 2>/dev/null | head -n 200 || true
            echo '```'
            echo ""
            echo "<details><summary>Last 120 lines of the build log</summary>"
            echo ""
            echo '```'
            tail -n 120 "$LOG" 2>/dev/null || true
            echo '```'
            echo ""
            echo "</details>"
          } > cloud-apk-report.md
          cat cloud-apk-report.md >> "$GITHUB_STEP_SUMMARY"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" --state open \
            --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file cloud-apk-report.md || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-apk-build-log
          path: |
            cloud-apk-build.log
            cloud-apk-report.md
          if-no-files-found: ignore
